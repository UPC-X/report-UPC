<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="1380" viewBox="0 0 1820 1380" role="img"><title>C4 · Nivel 3 · Componentes del backend</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="46" font-size="31" fill="#152E4D" font-weight="700">C4 · Nivel 3 · Componentes del backend</text><text x="45" y="79" font-size="18" fill="#263449" font-weight="400">Zoom del contenedor API REST · Diseño modular objetivo · Todos los componentes comparten proceso y despliegue</text><rect x="70" y="280" width="1670" height="780" rx="10" fill="#FCFDFE" stroke="#7E90A5" stroke-width="2" stroke-dasharray="9 5"/><text x="90" y="310" font-size="19" fill="#526579" font-weight="700">Backend modular · Java 21 / Spring Boot · Un único contenedor C4</text><polyline points="625,230 625,255 805,255 805,335" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><g><rect x="632" y="231" width="105.5" height="20" fill="white"/><text x="635" y="246" font-size="14" fill="#263449" font-weight="400">REST / bearer</text></g><polyline points="1180,230 1180,255 985,255 985,335" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><g><rect x="1037" y="231" width="105.5" height="20" fill="white"/><text x="1040" y="246" font-size="14" fill="#263449" font-weight="400">REST / cookie</text></g><polyline points="745,485 745,515 270,515 270,550" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><polyline points="805,485 805,525 650,525 650,550" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><polyline points="985,485 985,515 1025,515 1025,550" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1065,485 1065,510 1470,510 1470,550" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><polyline points="220,725 220,865" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><g><rect x="237" y="783" width="98" height="20" fill="white"/><text x="240" y="798" font-size="14" fill="#263449" font-weight="400">Solicita OTP</text></g><polyline points="375,725 375,815 550,815 550,865" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><polyline points="650,725 650,865" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><g><rect x="667" y="778" width="113" height="20" fill="white"/><text x="670" y="793" font-size="14" fill="#263449" font-weight="400">Lee / persiste</text></g><polyline points="920,725 920,800 820,800 820,865" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1420,725 1420,765 870,765 870,865" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><g><rect x="1117" y="769" width="128" height="20" fill="white"/><text x="1120" y="784" font-size="14" fill="#263449" font-weight="400">Transacción ACID</text></g><polyline points="1470,725 1470,743 650,743 650,725" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g><rect x="762" y="722" width="308" height="20" fill="white"/><text x="765" y="737" font-size="14" fill="#263449" font-weight="400">Coordina reserva / liberación (objetivo)</text></g><polyline points="1600,725 1600,795 1290,795 1290,865" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g><rect x="1337" y="800" width="270.5" height="20" fill="white"/><text x="1340" y="815" font-size="14" fill="#263449" font-weight="400">Valida evidencia privada (objetivo)</text></g><polyline points="1100,395 1720,395 1720,830 1180,830 1180,865" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><g><rect x="1357" y="360" width="188" height="20" fill="white"/><text x="1360" y="375" font-size="14" fill="#263449" font-weight="400">Subir / consultar medios</text></g><polyline points="1100,460 1705,460 1705,845 1570,845 1570,865" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g><rect x="1347" y="430" width="173" height="20" fill="white"/><text x="1350" y="445" font-size="14" fill="#263449" font-weight="400">Reportar / pedir ayuda</text></g><polyline points="1010,960 955,960" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><polyline points="1570,1025 1570,1040 720,1040 720,1025" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g><rect x="957" y="1041" width="195.5" height="20" fill="white"/><text x="960" y="1056" font-size="14" fill="#263449" font-weight="400">Guarda reportes y tickets</text></g><polyline points="267,1010 267,1125" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><g><rect x="277" y="1078" width="98" height="20" fill="white"/><text x="280" y="1093" font-size="14" fill="#263449" font-weight="400">SMTP / HTTPS</text></g><polyline points="720,1025 720,1125" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><g><rect x="742" y="1080" width="83" height="20" fill="white"/><text x="745" y="1095" font-size="14" fill="#263449" font-weight="400">JDBC / SQL</text></g><polyline points="1180,1025 1180,1125" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" /><g><rect x="1207" y="1080" width="143" height="20" fill="white"/><text x="1210" y="1095" font-size="14" fill="#263449" font-weight="400">Disco → S3 / HTTPS</text></g><g id="mobile"><rect x="430" y="105" width="390" height="125" rx="9" fill="#F0F2F5" stroke="#68778B" stroke-width="2" /><text x="448" y="130" font-size="13" fill="#68778B" font-weight="700">Contenedor vecino</text><text x="448" y="159" font-size="20" fill="#172B45" font-weight="700">Cliente móvil</text><text x="448" y="183" font-size="14" fill="#68778B" font-weight="400">Flutter / Dart</text><text x="448" y="208" font-size="15" fill="#263449" font-weight="400">HTTPS / JSON; bearer; multipart</text></g><g id="web"><rect x="985" y="105" width="390" height="125" rx="9" fill="#FFF6E5" stroke="#B27518" stroke-width="2" stroke-dasharray="7 4"/><text x="1003" y="130" font-size="13" fill="#B27518" font-weight="700">Contenedor vecino · objetivo</text><text x="1003" y="159" font-size="20" fill="#172B45" font-weight="700">Cliente web</text><text x="1003" y="183" font-size="14" fill="#B27518" font-weight="400">Angular / TypeScript</text><text x="1003" y="208" font-size="15" fill="#263449" font-weight="400">HTTPS / JSON; cookie HttpOnly</text></g><g id="security"><rect x="695" y="335" width="405" height="160" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2" /><text x="713" y="360" font-size="13" fill="#286095" font-weight="700">Componente</text><text x="713" y="389" font-size="20" fill="#172B45" font-weight="700">Entrada y seguridad</text><text x="713" y="413" font-size="14" fill="#286095" font-weight="400">SecurityConfig + controladores REST</text><text x="713" y="438" font-size="15" fill="#263449" font-weight="400">CORS, límite de acceso, validación DTO.</text><text x="713" y="459" font-size="15" fill="#263449" font-weight="400">AuthService.current + permisos por recurso.</text><text x="713" y="480" font-size="15" fill="#263449" font-weight="400">No confiar en un studentId del cliente.</text></g><g id="identity"><rect x="105" y="550" width="325" height="175" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2" /><text x="123" y="575" font-size="13" fill="#286095" font-weight="700">Componente</text><text x="123" y="604" font-size="20" fill="#172B45" font-weight="700">Identidad y perfil</text><text x="123" y="628" font-size="14" fill="#286095" font-weight="400">AuthService → módulo Identity</text><text x="123" y="653" font-size="15" fill="#263449" font-weight="400">Registro @upc.edu.pe, OTP y sesión.</text><text x="123" y="674" font-size="15" fill="#263449" font-weight="400">BCrypt; reset revoca sesiones.</text><text x="123" y="695" font-size="15" fill="#263449" font-weight="400">Perfil completo: ampliación pendiente.</text></g><g id="market"><rect x="485" y="550" width="325" height="175" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2" /><text x="503" y="575" font-size="13" fill="#286095" font-weight="700">Componente</text><text x="503" y="604" font-size="20" fill="#172B45" font-weight="700">Catálogo y disponibilidad</text><text x="503" y="628" font-size="14" fill="#286095" font-weight="400">Marketplace → módulo Catalog</text><text x="503" y="653" font-size="15" fill="#263449" font-weight="400">Publicar, consultar y reservar avisos.</text><text x="503" y="674" font-size="15" fill="#263449" font-weight="400">Editar, favoritos y ofertas continuas:</text><text x="503" y="695" font-size="15" fill="#263449" font-weight="400">extensiones del diseño objetivo.</text></g><g id="chat"><rect x="865" y="550" width="325" height="175" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2" /><text x="883" y="575" font-size="13" fill="#286095" font-weight="700">Componente</text><text x="883" y="604" font-size="20" fill="#172B45" font-weight="700">Conversaciones y mensajes</text><text x="883" y="628" font-size="14" fill="#286095" font-weight="400">Marketplace → módulo Communication</text><text x="883" y="653" font-size="15" fill="#263449" font-weight="400">Un hilo por aviso y comprador.</text><text x="883" y="674" font-size="15" fill="#263449" font-weight="400">Solo sus participantes pueden acceder.</text><text x="883" y="695" font-size="15" fill="#263449" font-weight="400">Refresco periódico; sin WebSocket.</text></g><g id="deals"><rect x="1245" y="550" width="450" height="175" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2" /><text x="1263" y="575" font-size="13" fill="#286095" font-weight="700">Componente</text><text x="1263" y="604" font-size="20" fill="#172B45" font-weight="700">Acuerdos y reputación</text><text x="1263" y="628" font-size="14" fill="#286095" font-weight="400">Marketplace → módulo Deals</text><text x="1263" y="653" font-size="15" fill="#263449" font-weight="400">Aceptación ≠ confirmación de entrega.</text><text x="1263" y="674" font-size="15" fill="#263449" font-weight="400">Lock del aviso; cierre bilateral y reseña.</text><text x="1263" y="695" font-size="15" fill="#263449" font-weight="400">Evidencias, eventos y avisos: pendientes.</text></g><g id="mailAdapter"><rect x="105" y="865" width="325" height="145" rx="9" fill="#FFF6E5" stroke="#B27518" stroke-width="2" stroke-dasharray="7 4"/><text x="123" y="890" font-size="13" fill="#B27518" font-weight="700">Componente · Adaptador</text><text x="123" y="919" font-size="20" fill="#172B45" font-weight="700">Entrega de correo</text><text x="123" y="943" font-size="14" fill="#B27518" font-weight="400">JavaMailSender → puerto MailGateway</text><text x="123" y="968" font-size="15" fill="#263449" font-weight="400">OTP con vencimiento y uso único.</text><text x="123" y="989" font-size="15" fill="#263449" font-weight="400">SMTP local; Resend por integrar.</text></g><g id="jdbc"><rect x="485" y="865" width="470" height="160" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2" /><text x="503" y="890" font-size="13" fill="#286095" font-weight="700">Componente · Adaptador</text><text x="503" y="919" font-size="20" fill="#172B45" font-weight="700">Persistencia transaccional</text><text x="503" y="943" font-size="14" fill="#286095" font-weight="400">JdbcClient + @Transactional / Flyway</text><text x="503" y="968" font-size="15" fill="#263449" font-weight="400">SQL parametrizado, FK, UNIQUE y locks.</text><text x="503" y="989" font-size="15" fill="#263449" font-weight="400">Extraer repositorios por módulo.</text><text x="503" y="1010" font-size="15" fill="#263449" font-weight="400">Persistencia y bloqueos explícitos.</text></g><g id="mediaAdapter"><rect x="1010" y="865" width="345" height="160" rx="9" fill="#FFF6E5" stroke="#B27518" stroke-width="2" stroke-dasharray="7 4"/><text x="1028" y="890" font-size="13" fill="#B27518" font-weight="700">Componente · Adaptador</text><text x="1028" y="919" font-size="20" fill="#172B45" font-weight="700">Validación y acceso a medios</text><text x="1028" y="943" font-size="14" fill="#B27518" font-weight="400">ImageController → Media / ObjectStore</text><text x="1028" y="968" font-size="15" fill="#263449" font-weight="400">JPEG/PNG, tamaño, recodificación.</text><text x="1028" y="989" font-size="15" fill="#263449" font-weight="400">Objetivo: evidencias privadas + R2.</text><text x="1028" y="1010" font-size="15" fill="#263449" font-weight="400">Hoy GET de fotos es público.</text></g><g id="support"><rect x="1410" y="865" width="285" height="160" rx="9" fill="#FFF6E5" stroke="#B27518" stroke-width="2" stroke-dasharray="7 4"/><text x="1428" y="890" font-size="13" fill="#B27518" font-weight="700">Componente</text><text x="1428" y="919" font-size="20" fill="#172B45" font-weight="700">Reportes y ayuda</text><text x="1428" y="943" font-size="14" fill="#B27518" font-weight="400">Módulo Support · pendiente</text><text x="1428" y="968" font-size="15" fill="#263449" font-weight="400">Recepción de reportes y tickets.</text><text x="1428" y="989" font-size="15" fill="#263449" font-weight="400">Sin sanción automática.</text><text x="1428" y="1010" font-size="15" fill="#263449" font-weight="400">Autorización propia por recurso.</text></g><g id="mail"><rect x="105" y="1125" width="325" height="125" rx="9" fill="#F0F2F5" stroke="#68778B" stroke-width="2" /><text x="123" y="1150" font-size="13" fill="#68778B" font-weight="700">Sistema externo</text><text x="123" y="1179" font-size="20" fill="#172B45" font-weight="700">Proveedor de correo</text><text x="123" y="1203" font-size="14" fill="#68778B" font-weight="400">SMTP / Resend</text><text x="123" y="1228" font-size="15" fill="#263449" font-weight="400">Entrega al correo del estudiante.</text></g><g id="db"><rect x="545" y="1125" width="345" height="125" rx="9" fill="#F0F2F5" stroke="#68778B" stroke-width="2" /><text x="563" y="1150" font-size="13" fill="#68778B" font-weight="700">Contenedor vecino</text><text x="563" y="1179" font-size="20" fill="#172B45" font-weight="700">PostgreSQL 17</text><text x="563" y="1203" font-size="14" fill="#68778B" font-weight="400">Datos de UPC-X</text><text x="563" y="1228" font-size="15" fill="#263449" font-weight="400">Único almacén relacional.</text></g><g id="media"><rect x="1010" y="1125" width="345" height="125" rx="9" fill="#F0F2F5" stroke="#68778B" stroke-width="2" /><text x="1028" y="1150" font-size="13" fill="#68778B" font-weight="700">Contenedor vecino</text><text x="1028" y="1179" font-size="20" fill="#172B45" font-weight="700">Almacén de archivos</text><text x="1028" y="1203" font-size="14" fill="#68778B" font-weight="400">Volumen local / R2 objetivo</text><text x="1028" y="1228" font-size="15" fill="#263449" font-weight="400">La API aplica las reglas de acceso.</text></g><text x="45" y="1285" font-size="15" fill="#526579" font-weight="700">LECTURA</text><text x="145" y="1285" font-size="16" fill="#263449" font-weight="400">Azul: núcleo existente   ·   Ámbar discontinuo: desarrollo/refactor pendiente   ·   Gris: elemento externo</text><text x="45" y="1314" font-size="16" fill="#263449" font-weight="400">Azul: núcleo con código real, aún no separado en estos módulos. Ámbar: componente nuevo o refactor por implementar.</text><text x="45" y="1338" font-size="16" fill="#263449" font-weight="400">Marketplace concentra hoy catálogo, chat y acuerdos. El diseño separa responsabilidades; NO representa servicios desplegados aparte.</text></g></svg>