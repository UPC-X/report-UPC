" y="1081" font-size="13" fill="#263449" font-weight="400">R4 payment_evidences.image_id → images  [0..N : 1]</text><text x="35" y="1205" font-size="14" fill="#263449" font-weight="400">Pata de cuervo = muchos; círculo = opcional; barra = uno. Las FK opcionales están explicitadas en la lista.</text><text x="35" y="1230" font-size="14" fill="#263449" font-weight="400">Azul: tabla V1 ampliada. Ámbar: nueva. Gris discontinuo: la misma tabla, referenciada desde otra vista.</text></g></svg>