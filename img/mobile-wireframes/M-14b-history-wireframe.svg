<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-14b · Historial · UPC-X</title><desc id="description">Los roles filtran el historial, no cambian de cuenta. Solo las entregas completadas habilitan reseñas. La cancelación se mantiene visible en el historial.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-14b · Historial</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Historial</text><rect x="62" y="151" width="104" height="48" rx="24" fill="#e2e2e2" stroke="#222" stroke-width="1.5"/><text x="114" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="middle">✓ Todas</text><rect x="174" y="151" width="104" height="48" rx="24" fill="#fff" stroke="#777" stroke-width="1.5"/><text x="226" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="middle">Compras</text><rect x="286" y="151" width="104" height="48" rx="24" fill="#fff" stroke="#777" stroke-width="1.5"/><text x="338" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="middle">Ventas</text><rect x="62" y="243" width="328" height="66" rx="12" fi