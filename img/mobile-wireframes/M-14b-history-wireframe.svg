-width="1.5"/><text x="475" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Decisiones del wireframe</text><line x1="475" y1="84" x2="724" y2="84" stroke="#777" stroke-width="1.5"/><circle cx="416" cy="175" r="11" fill="#222"/><text x="416" y="179" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="488" cy="115" r="11" fill="#222"/><text x="488" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Los roles filtran el</text><text x="510" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">historial, no cambian de</text><text x="510" y="147" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">cuenta.</text><circle cx="416" cy="278" r="11" fill="#222"/><text x="416" y="282" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="488" cy="179" r="11" fill="#222"/><text x="488" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Solo las entregas completadas</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">habilitan reseñas.</text><circle cx="416" cy="363" r="11" fill="#222"/><text x="416" y="367" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="488" cy="243" r="11" fill="#222"/><text x="488" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle"