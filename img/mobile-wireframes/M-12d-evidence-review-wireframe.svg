<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-12d · Revisar evidencia · UPC-X</title><desc id="description">El receptor ve quién compartió la captura. Distinguir declaración de comprobación por la plataforma. Solo la contraparte declara recepción o discrepancia.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-12d · Revisar evidencia</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Revisar evidencia</text><rect x="62" y="169" width="126" height="146" rx="10" fill="#e2e2e2" stroke="#777" stroke-width="1.5"/><line x1="70" y1="177" x2="180" y2="307" stroke="#777" stroke-width="1.5"/><line x1="180" y1="177" x2="70" y2="307" stroke="#777" stroke-width="1.5"/><rect x="70" y="227" width="110" height="30" rx="3" fill="#e2e2e2" stroke="none" stroke-width="1.5"/><text x="125" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#444" text-anchor="middle">Captura</text><text x="205" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Yape · S/ 65.00</text><text x="205" y="226" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Enviada por Alex</text><rect x="62" y="367" width="328" height="120" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="393" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Vista de Camila</text><text x="78" y="416" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Comprueba la recepción por tu cuenta</text><text x="78" y="433" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">antes de declararla. UPC-X no verifica</text><text x="78" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">el pago.</text><rect x="62" y="539" width="328" height="48" rx="12" fill="#222" stroke="#555" stroke-width="1.5"/><text x="226" y="568" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Declaro haber recibido el importe</text><rect x="62" y="607" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="636" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Reportar discrepancia</text><rect x="62" y="675" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="704" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Volver sin confirmar</text><line x1="190" y1="925" x2="282" y2="925" stroke="#777" stroke-width="1.5"/><text x="475" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Decisiones del wireframe</text><line x1="475" y1="84" x2="724" y2="84" stroke="#777" stroke-width="1.5"/><circle cx="416" cy="240" r="11" fill="#222"/><text x="416" y="244" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="488" cy="115" r="11" fill="#222"/><text x="488" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">El receptor ve quién</text><text x="510" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">compartió la captura.</text><circle cx="416" cy="427" r="11" fill="#222"/><text x="416" y="431" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="488" cy="179" r="11" fill="#222"/><text x="488" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Distinguir declaración de</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">comprobación por la</text><text x="510" y="211" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">plataforma.</text><circle cx="416" cy="563" r="11" fill="#222"/><text x="416" y="567" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="488" cy="243" r="11" fill="#222"/><text x="488" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="510" y="239" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Solo la contraparte declara</text><text x="510" y="257" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">recepción o discrepancia.</text><text x="475" y="566" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Estados y recorrido</text><text x="475" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Recibida → M-12b</text><text x="475" y="638" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Discrepancia → M-12c</text><text x="475" y="681" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Pendiente → M-10</text><line x1="475" y1="790" x2="724" y2="790" stroke="#777" stroke-width="1.5"/><text x="475" y="816" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Referencia de pantalla: 412 × 915</text><text x="475" y="835" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Fidelidad: baja · Plataforma: común</text><text x="475" y="854" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Idioma: es-419 · Datos ilustrativos</text><text x="475" y="873" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">RichStudent · UPC-X</text><text x="475" y="906" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Estado derivado de M-12</text></svg>
