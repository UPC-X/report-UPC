<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-03d · Error al cargar · UPC-X</title><desc id="description">Mantener consulta y filtros elegidos. Describir el problema sin mostrar detalles técnicos. Reintento vuelve al estado de carga.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-03d · Error al cargar</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Error al cargar</text><text x="62" y="161" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Buscar avisos</text><rect x="62" y="171" width="328" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="201" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Calculadora</text><rect x="62" y="309" width="328" height="117" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">No pudimos cargar los avisos</text><text x="78" y="358" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Revisa tu conexión y vuelve a</text><text x="78" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">intentarlo. Conservamos tu búsqueda.</text><rect x="62" y="487" width="328" height="48" rx="12" fill="#222" stroke="#555" stroke-width="1.5"/><text x="226" y="516" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Reintentar</text><rect x="44" y="842" width="384" height="94" rx="0" fill="#f1f1f1" stroke="none" stroke-width="1.5"/><line x1="44" y1="842" x2="428" y2="842" stroke="#777" stroke-width="1.5"/><rect x="55" y="853" width="54" height="68" rx="10" fill="#dedede" stroke="none" stroke-width="1.5"/><circle cx="82" cy="875" r="10" fill="#222" stroke="#555"/><text x="82" y="910" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Inicio</text><rect x="132" y="853" width="54" height="68" rx="10" fill="#f1f1f1" stroke="none" stroke-width="1.5"/><circle cx="159" cy="875" r="10" fill="#fff" stroke="#555"/><text x="159" y="910" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#222" text-anchor="middle">Guardados</text><rect x="209" y="853" width="54" height="68" rx="10" fill="#f1f1f1" stroke="none" stroke-width="1.5"/><circle cx="236" cy="875" r="19" fill="#fff" stroke="#555"/><text x="236" y="881" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222" text-anchor="middle">+</text><text x="236" y="910" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#222" text-anchor="middle">Publicar</text><rect x="286" y="853" width="54" height="68" rx="10" fill="#f1f1f1" stroke="none" stroke-width="1.5"/><circle cx="313" cy="875" r="10" fill="#fff" stroke="#555"/><text x="313" y="910" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#222" text-anchor="middle">Chats</text><rect x="363" y="853" width="54" height="68" rx="10" fill="#f1f1f1" stroke="none" stroke-width="1.5"/><circle cx="390" cy="875" r="10" fill="#fff" stroke="#555"/><text x="390" y="910" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#222" text-anchor="middle">Perfil</text><text x="475" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Decisiones del wireframe</text><line x1="475" y1="84" x2="724" y2="84" stroke="#777" stroke-width="1.5"/><circle cx="416" cy="197" r="11" fill="#222"/><text x="416" y="201" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="488" cy="115" r="11" fill="#222"/><text x="488" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Mantener consulta y filtros</text><text x="510" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">elegidos.</text><circle cx="416" cy="367" r="11" fill="#222"/><text x="416" y="371" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="488" cy="179" r="11" fill="#222"/><text x="488" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Describir el problema sin</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">mostrar detalles técnicos.</text><circle cx="416" cy="511" r="11" fill="#222"/><text x="416" y="515" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="488" cy="243" r="11" fill="#222"/><text x="488" y="247" font-family="Arial, sans-serif" font-size="11" font-wei