<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-13 · Cierre de entrega · UPC-X</title><desc id="description">Mantener el contexto del producto acordado. Mostrar las dos confirmaciones por separado. El CTA registra solo la confirmación del usuario actual. Cancelar exige un motivo y confirmación. Una reseña por persona, solo tras el cierre bilateral.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-13 · Cierre de entrega</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Cierre de entrega</text><rect x="62" y="143" width="328" height="118" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="74" y="155" width="84" height="90" rx="10" fill="#e2e2e2" stroke="#777" stroke-width="1.5"/><line x1="82" y1="163" x2="150" y2="237" stroke="#777" stroke-width="1.5"/><line x1="150" y1="163" x2="82" y2="237" stroke="#777" stroke-width="1.5"/><rect x="82" y="185" width="68" height="30" rx="3" fill="#e2e2e2" stroke="none" stroke-width="1.5"/><text x="116" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#444" text-anchor="middle">Foto</text><text x="170" y="173" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Calculadora científica</text><text x="170" y="194" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#222" text-anchor="start">Monterrico · Como nuevo</text><text x="170" y="223" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#222" text-anchor="start">S/ 65.00</text><text x="170" y="244" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Ver detalle →</text><rect x="62" y="285" width="328" height="100" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="311" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Entrega pendiente de confirmar</text><text x="78" y="334" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Confirma únicamente después de revisar</text><text x="78" y="351" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">y recibir lo acordado.</text><rect x="62" y="409" width="328" height="66" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="434" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Tu confirmación</text><text x="76" y="456" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Pendiente</text><text x="372" y="446" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="end">○</text><rect x="62" y="489" width="328" height="66" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="514" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Confirmación de Camila</text><text x="76" y="536" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Pendiente</text><text x="372" y="526" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="end">○</text><rect x="62" y="592" width="328" height="48" rx="12" fill="#222" stroke="#555" stroke-width="1.5"/><text x="226" y="621" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Confirmar mi entrega</text><rect x="62" y="656" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="685" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">No se concretó</text><rect x="62" y="731" width="328" height="79" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="757" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Reseña disponible al completar</text><text x="78" y="780" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Se habilita cuando ambas partes</text><text x="78" y="797" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">confirman.</text><line x1="190" y1="925" x2="282" y2="925" stroke="#777" stroke-width="1.5"/><text x="475" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Decisiones del wireframe</text><line x1="475" y1="84" x2="724" y2="84" stroke="#777" stroke-width="1.5"/><circle cx="416" cy="204" r="11" fill="#222"/><text x="416" y="208" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="488" cy="115" r="11" fill="#222"/><text x="488" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Mantener el contexto del</text><text x="510" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">producto acordado.</text><circle cx="416" cy="451" r="11" fill="#222"/><text x="416" y="455" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="488" cy="179" r="11" fill="#222"/><text x="488" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Mostrar las dos</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">confirmaciones por separado.</text><circle cx="416" cy="616" r="11" fill="#222"/><text x="416" y="620" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="488" cy="243" r="11" fill="#222"/><text x="488" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="510" y="239" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">El CTA registra solo la</text><text x="510" y="257" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">confirmación del usuario</text><text x="510" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">actual.</text><circle cx="416" cy="680" r="11" fill="#222"/><text x="416" y="684" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="488" cy="307" r="11" fill="#222"/><text x="488" y="311" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="510" y="303" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Cancelar exige un motivo y</text><text x="510" y="321" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">confirmación.</text><circle cx="416" cy="770" r="11" fill="#222"/><text x="416" y="774" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="488" cy="371" r="11" fill="#222"/><text x="488" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="510" y="367" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Una reseña por persona, solo</text><text x="510" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">tras el cierre bilateral.</text><text x="475" y="566" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Estados y recorrido</text><text x="475" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Una confirmación → M-13a</text><text x="475" y="638" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Completada y reseña → M-13b</text><text x="475" y="681" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Cancelación → M-13c</text><line x1="475" y1="790" x2="724" y2="790" stroke="#777" stroke-width="1.5"/><text x="475" y="816" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Referencia de pantalla: 412 × 915</text><text x="475" y="835" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Fidelidad: baja · Plataforma: común</text><text x="475" y="854" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Idioma: es-419 · Datos ilustrativos</text><text x="475" y="873" font-family="Arial, sans-serif" font-size="11" font-weight="400"