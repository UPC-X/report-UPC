<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-01 · Acceso · UPC-X</title><desc id="description">Una sola identidad permite comprar y publicar. El correo conserva su etiqueta durante la escritura. El idioma se elige antes del ingreso. Consentimiento explícito y documentos consultables. Validar correo y consentimiento antes de enviar.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-01 · Acceso</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Acceso</text><text x="62" y="181" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#222" text-anchor="start">UPC-X</text><text x="62" y="219" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#222" text-anchor="start">Compra, vende e intercambia</text><text x="62" y="244" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#222" text-anchor="start">dentro de tu comunidad UPC.</text><rect x="62" y="299" width="328" height="96" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Una cuenta, distintas posibilidades</text><text x="78" y="348" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Explora avisos o publica los tuyos con</text><text x="78" y="365" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">tu mismo perfil.</text><text x="62" y="434" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Correo institucional</text><rect x="62" y="444" width="328" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="474" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">u202600001@upc.edu.pe</text><text x="62" y="517" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Usa tu correo @upc.edu.pe.</text><rect x="62" y="553" width="158" height="48" rx="24" fill="#e2e2e2" stroke="#222" stroke-width="1.5"/><text x="141" y="582" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="middle">✓ Español</text><rect x="232" y="553" width="158" height="48" rx="24" fill="#fff" stroke="#777" stroke-width="1.5"/><text x="311" y="582" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="middle">English</text><rect x="62" y="626" width="24" height="24" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="100" y="641" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Acepto los términos y la política</text><text x="100" y="660" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">de privacidad.</text><rect x="62" y="706" width="328" height="48" rx="12" fill="#222" stroke="#555" stroke-width="1.5"/><text x="226" y="735" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Enviar código</text><text x="62" y="783" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Ver términos y privacidad →</text><line x1="190" y1="925" x2="282" y2="925" stroke="#777" stroke-width="1.5"/><text x="475" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Decisiones del wireframe</text><line x1="475" y1="84" x2="724" y2="84" stroke="#777" stroke-width="1.5"/><circle cx="416" cy="231" r="11" fill="#222"/><text x="416" y="235" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="488" cy="115" r="11" fill="#222"/><text x="488" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Una sola identidad permite</text><text x="510" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">comprar y publicar.</text><circle cx="416" cy="470" r="11" fill="#222"/><text x="416" y="474" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="488" cy="179" r="11" fill="#222"/><text x="488" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">El correo conserva su</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">etiqueta durante la</text><text x="510" y="211" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">escritura.</text><circle cx="416" cy="577" r="11" fill="#222"/><text x="416" y="581" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="488" cy="243" r="11" fill="#222"/><text x="488" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="510" y="239" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">El idioma se elige antes del</text><text x="510" y="257" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">ingreso.</text><circle cx="416" cy="646" r="11" fill="#222"/><text x="416" y="650" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="488" cy="307" r="11" fill="#222"/><text x="488" y="311" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="510" y="303" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Consentimiento explícito y</text><text x="510" y="321" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">documentos consultables.</text><circle cx="416" cy="730" r="11" fill="#222"/><text x="416" y="734" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="488" cy="371" r="11" fill="#222"/><text x="488" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="510" y="367" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Validar correo y</text><text x="510" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">consentimiento antes de</text><text x="510" y="403" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">enviar.</text><text x="475" y="566" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Estados y recorrido</text><text x="475" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Continuar → M-02</text><text x="475" y="638" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Correo inválido → M-01a</text><text x="475" y="681" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Sin conexión: conservar el correo</text><line x1="475" y1="790" x2="724" y2="790" stroke="#777" stroke-width="1.5"/><text x="475" y="816" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Referencia de pantalla: 412 × 915</text><text x="475" y="835" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Fidelidad: baja · Plataforma: común</text><text x="475" y="854" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Idioma: es-419 · Datos ilustrativos</text><text x="475" y="873" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">RichStudent · UPC-X</text><text x="475" y="906" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Pantalla principal · M-01</text></svg>
