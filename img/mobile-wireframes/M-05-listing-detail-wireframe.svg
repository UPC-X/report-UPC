<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-05 · Detalle del aviso · UPC-X</title><desc id="description">La galería mantiene posición y texto alternativo. Título y precio preceden al contenido secundario. El perfil público no expone el correo completo. Seguridad breve en el punto de decisión. Contactar abre el hilo de este aviso y participantes. Guardar expresa su estado también con una etiqueta.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-05 · Detalle del aviso</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Detalle del aviso</text><rect x="62" y="140" width="328" height="183" rx="10" fill="#e2e2e2" stroke="#777" stroke-width="1.5"/><line x1="70" y1="148" x2="382" y2="315" stroke="#777" stroke-width="1.5"/><line x1="382" y1="148" x2="70" y2="315" stroke="#777" stroke-width="1.5"/><rect x="70" y="216.5" width="312" height="30" rx="3" fill="#e2e2e2" stroke="none" stroke-width="1.5"/><text x="226" y="236.5" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#444" text-anchor="middle">Galería · Foto 1 de 3</text><text x="62" y="355" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#222" text-anchor="start">Calculadora científica</text><text x="62" y="388" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#222" text-anchor="start">S/ 65.00</text><rect x="62" y="409" width="158" height="48" rx="24" fill="#fff" stroke="#777" stroke-width="1.5"/><text x="141" y="438" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="middle">Como nuevo</text><rect x="232" y="409" width="158" height="48" rx="24" fill="#fff" stroke="#777" stroke-width="1.5"/><text x="311" y="438" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="middle">Monterrico</text><text x="62" y="491" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Calculadora con tapa, ideal para los</text><text x="62" y="510" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">cursos de ciencias. Entrega en campus.</text><rect x="62" y="552" width="328" height="66" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="577" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Camila R. · Correo UPC verificado</text><text x="76" y="599" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">4.8 / 5 · 12 reseñas · Ver perfil</text><text x="372" y="589" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="end">›</text><rect x="62" y="634" width="328" height="90" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="660" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Coordina con seguridad</text><text x="78" y="683" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Revisa el producto y acuerda un punto</text><text x="78" y="700" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">de encuentro dentro del campus.</text><rect x="62" y="742" width="328" height="48" rx="12" fill="#222" stroke="#555" stroke-width="1.5"/><text x="226" y="771" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Contactar a Camila</text><rect x="62" y="807" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="836" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Guardar aviso</text><line x1="190" y1="925" x2="282" y2="925" stroke="#777" stroke-width="1.5"/><text x="475" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Decisiones del wireframe</text><line x1="475" y1="84" x2="724" y2="84" stroke="#777" stroke-width="1.5"/><circle cx="416" cy="238" r="11" fill="#222"/><text x="416" y="242" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="488" cy="115" r="11" fill="#222"/><text x="488" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">La galería mantiene posición</text><text x="510" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">y texto alternativo.</text><circle cx="416" cy="380" r="11" fill="#222"/><text x="416" y="384" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="488" cy="179" r="11" fill="#222"/><text x="488" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Título y 