rif" font-size="11" font-weight="400" fill="#222" text-anchor="start">RichStudent · UPC-X</text><text x="475" y="906" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Estado derivado de M-03</text></svg>
