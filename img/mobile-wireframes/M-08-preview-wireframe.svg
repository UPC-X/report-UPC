<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-08 · Previsualización · UPC-X</title><desc id="description">Distinguir previsualización de publicación real. La portada corresponde al orden elegido en M-07a. Se muestran los datos ingresados, sin reemplazarlos. Volver conserva datos e imágenes. Evitar doble envío mientras se publica.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-08 · Previsualización</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Previsualización</text><rect x="62" y="143" width="328" height="85" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="169" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Todavía no está publicado</text><text x="78" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Revisa cómo verán tu aviso los demás</text><text x="78" y="209" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">estudiantes.</text><rect x="62" y="251" width="328" height="162" rx="10" fill="#e2e2e2" stroke="#777" stroke-width="1.5"/><line x1="70" y