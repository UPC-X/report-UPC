<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-09 · Chats · UPC-X</title><desc id="description">Buscar por participante o aviso. El contador deriva de mensajes no leídos. Cada fila identifica contraparte y publicación. Los avisos propios conservan el mismo patrón de hilo. Chats es un destino de primer nivel.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-09 · Chats</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Chats</text><text x="62" y="151" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Buscar conversación</text><rect x="62" y="161" width="328" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="191" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Nombre o título del aviso</text><rect x="62" y="230" width="158" height="48" rx="24" fill="#e2e2e2" stroke="#222" stroke-width="1.5"/><text x="141" y="259" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="middle">✓ Todos</text><rect x="232" y="230" width="158" height="48" rx="24" fill="#fff" stroke="#777" stroke-width="1.5"/><text x="311" y="259" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor