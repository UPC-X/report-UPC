<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-06b · Publicación retirada · UPC-X</title><desc id="description">Confirmar el resultado con el título del aviso. Devolver al listado de avisos propios.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-06b · Publicación retirada</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Publicación retirada</text><rect x="62" y="251" width="328" height="113" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="277" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">El aviso fue retirado</text><text x="78" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Libro de cálculo ya no aparece en el</text><text x="78" y="317" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">catálogo. Puedes revisar su historial.</text><rect x="62" y="431" width="328" height="48" rx="12" fill="#222" stroke="#555" stroke-width="1.5"/><text x="226" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">I