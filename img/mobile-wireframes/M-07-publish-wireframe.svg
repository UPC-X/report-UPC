<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-07 · Publicar aviso · UPC-X</title><desc id="description">Dividir el formulario mantiene campos y CTA visibles. La condición solo aplica a productos. Título persistente y errores junto al campo. Importe numérico en soles, mayor o igual a cero. El campus conecta búsqueda y acuerdo de entrega. Continuar conserva el borrador durante el recorrido.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-07 · Publicar aviso</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Publicar aviso</text><text x="62" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Paso 1 de 2 · Datos del aviso</text><rect x="62" y="177" width="104" height="48" rx="24" fill="#e2e2e2" stroke="#222" stroke-width="1.5"/><text x="114" y="206" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="middle">✓ Producto</text><rect x="174" y="177" width="104" height="48" rx="24" fill="#fff" stroke="#777" stroke-width="1.5"/><text x="226" y="206" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="middle">Servicio</text><rect x="286" y="177" width="104" height="48" rx="24" fill="#fff" stroke="#777" stroke-width="1.5"/><text x="3