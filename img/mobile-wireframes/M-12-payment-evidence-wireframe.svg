<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-12 · Evidencia de pago · UPC-X</title><desc id="description">El estado describe una declaración, no una validación bancaria. Combinar captura y metadatos propios de UPC-X. Antes de enviar se puede reemplazar el archivo. Validar importe y formato de imagen. Registrar emisor, transacción y mensaje asociado.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-12 · Evidencia de pago</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Evidencia de pago</text><rect x="62" y="143" width="328" height="96" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="169" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Captura compartida por ti</text><text x="78" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">UPC-X conserva la evidencia; no procesa</text><text x="78" y="209" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">ni verifica la operación.</text><rect x="62" y="261" width="126" height="141" rx="10" fill="#e2e2e2" stroke="#777" stroke-width="1.5"/><line x1="70" y1="269" x2="180" y2="394" stroke="#777" stroke-width="1.5"/><line x1="180" y1="269" x2="70" y2="394" stroke="#777" stroke-width="1.5"/><rect x="70" y="316.5" width="110" height="30" rx="3" fill="#e2e2e2" stroke="none" stroke-width="1.5"/><text x="125" y="336.5" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#444" text-anchor="middle">Captura</text><text x="204" y="286" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Revisa y oculta datos</text><text x="204" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">personales antes de</text><text x="204" y="324" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">compartir.</text><rect x="62" y="418" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="447" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Seleccionar o reemplazar captura</text><text x="62" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Medio de pago</text><rect x="62" y="510" width="328" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="540" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Yape                            ▾</text><text x="62" y="582" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Importe declarado en soles</text><rect x="62" y="592" width="328" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="622" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">65.00</text><text x="62" y="664" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Referencia parcial opcional: •••• 4821</text><rect x="62" y="704" width="328" height="48" rx="12" fill="#222" stroke="#555" stroke-width="1.5"/><text x="226" y="733" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Compartir evidencia</text><text x="62" y="784" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Solo visible para los participantes.</text><line x1="190" y1="925" x2="282" y2="925" stroke="#777" stroke-width="1.5"/><text x="475" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Decisiones del wireframe</text><line x1="475" y1="84" x2="724" y2="84" stroke="#777" stroke-width="1.5"/><circle cx="416" cy="190" r="11" fill="#222"/><text x="416" y="194" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="488" cy="115" r="11" fill="#222"/><text x="488" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">El estado describe una</text><text x="510" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">declaración, no una</text><text x="510" y="147" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">validación bancaria.</text><circle cx="416" cy="332" r="11" fill="#222"/><text x="416" y="336" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="488" cy="179" r="11" fill="#222"/><text x="488" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Combinar captura y metadatos</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">propios de UPC-X.</text><circle cx="416" cy="442" r="11" fill="#222"/><text x="416" y="446" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="488" cy="243" r="11" fill="#222"/><text x="488" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="510" y="239" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Antes de enviar se puede</text><text x="510" y="257" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">reemplazar el archivo.</text><circle cx="416" cy="618" r="11" fill="#222"/><text x="416" y="622" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="488" cy="307" r="11" fill="#222"/><text x="488" y="311" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="510" y="303" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Validar importe y formato de</text><text x="510" y="321" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">imagen.</text><circle cx="416" cy="728" r="11" fill="#222"/><text x="416" y="732" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="488" cy="371" r="11" fill="#222"/><text x="488" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="510" y="367" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Registrar emisor, transacción</text><text x="510" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">y mensaje asociado.</text><text x="475" y="566" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Estados y recorrido</text><text x="475" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Enviada → M-12a</text><text x="475" y="638" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Recibida → M-12b</text><text x="475" y="681" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Discrepancia → M-12c</text><line x1="475" y1="790" x2="724" y2="790" stroke="#777" stroke-width="1.5"/><text x="475" y="816" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Referencia de pantalla: 412 × 915</text><text x="475" y="835" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Fidelidad: baja · Plataforma: común</text><text x="475" y="854" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Idioma: es-419 · Datos ilustrativos</text><text x="475" y="873" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">RichStudent · UPC-X</text><text x="475" y="906" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Pantalla principal · M-12</text></svg>
