<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-10 · Camila R. · UPC-X</title><desc id="description">El encabezado mantiene el aviso y la contraparte. El pago sucede fuera de UPC-X. Diferenciar remitente y estado mediante texto. El acuerdo pertenece a esta conversación. Adjuntar evidencia requiere una transacción asociada. Mensaje fallido conserva el texto y ofrece reintento.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-10 · Camila R.</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Camila R.</text><rect x="62" y="139" width="328" height="66" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="164" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Calculadora científica · S/ 65.00</text><text x="76" y="186" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Monterrico · Ver aviso</text><text x="372" y="176" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="end">›</text><rect x="62" y="225" width="328" height="73" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text 