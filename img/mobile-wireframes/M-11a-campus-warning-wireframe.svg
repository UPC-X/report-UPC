font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Una sede distinta exige una</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">nueva aceptación de ambos.</text><text x="475" y="566" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Estados y recorrido</text><text x="475" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Corregir / proponer → M-11</text><text x="475" y="638" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Sin aceptación: seguir pendiente</text><line x1="475" y1="790" x2="724" y2="790" stroke="#777" stroke-width="1.5"/><text x="475" y="816" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Referencia de pantalla: 412 × 915</text><text x="475" y="835" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Fidelidad: baja · Plataforma: común</text><text x="475" y="854" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Idioma: es-419 · Datos ilustrativos</text><text x="475" y="873" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">RichStudent · UPC-X</text><text x="475" y="906" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Estado derivado de M-11</text></svg>
