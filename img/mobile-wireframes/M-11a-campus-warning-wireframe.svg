<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-11a · Revisar el campus · UPC-X</title><desc id="description">Mostrar la sede elegida y su diferencia con el aviso. Una sede distinta exige una nueva aceptación de ambos.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-11a · Revisar el campus</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Revisar el campus</text><text x="62" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Campus propuesto</text><rect x="62" y="185" width="328" height="48" rx="10" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">San Miguel                    ▾</text><rect x="62" y="286" width="328" height="117" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="312" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">El aviso indica Monterrico</text><text x="78" y="335" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Confirma con