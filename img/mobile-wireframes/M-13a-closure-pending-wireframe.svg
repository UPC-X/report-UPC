<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-13a · Esperando confirmación · UPC-X</title><desc id="description">Una confirmación no completa la operación. La interfaz no puede confirmar en nombre de la otra persona. La reseña sigue bloqueada mientras falte una parte.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-13a · Esperando confirmación</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Esperando confirmación</text><rect x="62" y="197" width="328" height="109" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="223" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Tu entrega está confirmada</text><text x="78" y="246" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Falta la confirmación de Camila para</text><text x="78" y="263" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">completar la transacción.</text><rect x="62" y="346" width="328" height="66" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="371" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Tu confirmación</text><text x="76" y="393" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Confirmada</text><text x="372" y="383" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="end">✓</text><rect x="62" y="428" width="328" height="66" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="453" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Confirmación de Camila</text><text x="76" y="475" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Pendiente</text><text x="372" y="465" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="end">○</text><rect x="62" y="552" width="328" height="48" rx="12" fill="#e5e5e5" stroke="#555" stroke-width="1.5"/><text x="226" y="581" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#666" text-anchor="middle">Calificar todavía no disponible</text><rect x="62" y="620" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="649" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Volver a la conversación</text><line x1="190" y1="925" x2="282" y2="925" stroke="#777" stroke-width="1.5"/><text x="475" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Decisiones del wireframe</text><line x1="475" y1="84" x2="724" y2="84" stroke="#777" stroke-width="1.5"/><circle cx="416" cy="250" r="11" fill="#222"/><text x="416" y="254" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="488" cy="115" r="11" fill="#222"/><text x="488" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Una confirmación no completa</text><text x="510" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">la operación.</text><circle cx="416" cy="462" r="11" fill="#222"/><text x="416" y="466" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="488" cy="179" r="11" fill="#222"/><text x="488" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">La interfaz no puede</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">confirmar en nombre de la</text><text x="510" y="211" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">otra persona.</text><circle cx="416" cy="576" r="11" fill="#222"/><text x="416" y="580" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="488" cy="243" r="11" fill="#222"/><text x="488" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="510" y="239" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">La reseña sigue bloqueada</text><text x="510" y="257" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">mientras falte una parte.</text><text x="475" y="566" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Estados y recorrido</text><text x="475" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Ambas confirman → M-13b</text><text x="475" y="638" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Conversación → M-10</text><line x1="475" y1="790" x2="724" y2="790" stroke="#777" stroke-width="1.5"/><text x="475" y="816" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Referencia de pantalla: 412 × 915</text><text x="475" y="835" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Fidelidad: baja · Plataforma: común</text><text x="475" y="854" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Idioma: es-419 · Datos ilustrativos</text><text x="475" y="873" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">RichStudent · UPC-X</text><text x="475" y="906" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Estado derivado de M-13</text></svg>
