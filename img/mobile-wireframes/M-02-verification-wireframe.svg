<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-02 · Verificación · UPC-X</title><desc id="description">Cambiar el correo devuelve a M-01. Permitir pegar y autocompletar el código completo. Mostrar vigencia y espera de reenvío por separado. Confirmar solo con seis dígitos válidos. El sello describe únicamente el correo verificado.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-02 · Verificación</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Verificación</text><text x="62" y="163" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222" text-anchor="start">Escribe el código que enviamos a tu</text><text x="62" y="186" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#222" text-anchor="start">correo institucional.</text><text x="62" y="234" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">u202600001@upc.edu.pe</text><rect x="62" y="255" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="284" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Cambiar correo</text><text x="62" y="343" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Código de seis dígitos</text><rect x="62" y="358" width="48" height="56" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="86" y="393" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="middle">—</text><rect x="118" y="358" width="48" height="56" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="142" y="393" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="middle">—</text><rect x="174" y="358" width="48" height="56" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="198" y="393" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="middle">—</text><rect x="230" y="358" width="48" height="56" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="254" y="393" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="middle">—</text><rect x="286" y="358" width="48" height="56" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="310" y="393" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="middle">—</text><rect x="342" y="358" width="48" height="56" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="366" y="393" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="middle">—</text><text x="62" y="446" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Vigencia restante: 04:32</text><rect x="62" y="478" width="328" height="48" rx="12" fill="#222" stroke="#555" stroke-width="1.5"/><text x="226" y="507" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Verificar código</text><rect x="62" y="542" width="328" height="48" rx="12" fill="#e5e5e5" stroke="#555" stroke-width="1.5"/><text x="226" y="571" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#666" text-anchor="middle">Reenviar en 00:30</text><rect x="62" y="628" width="328" height="102" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="654" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Verificamos tu correo UPC</text><text x="78" y="677" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">La verificación no certifica identidad</text><text x="78" y="694" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">civil ni comportamiento.</text><line x1="190" y1="925" x2="282" y2="925" stroke="#777" stroke-width="1.5"/><text x="475" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Decisiones del wireframe</text><line x1="475" y1="84" x2="724" y2="84" stroke="#777" stroke-width="1.5"/><circle cx="416" cy="231" r="11" fill="#222"/><text x="416" y="235" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="488" cy="115" r="11" fill="#222"/><text x="488" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Cambiar el correo devuelve a</text><text x="510" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">M-01.</text><circle cx="416" cy="386" r="11" fill="#222"/><text x="416" y="390" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="488" cy="179" r="11" fill="#222"/><text x="488" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Permitir pegar y</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">autocompletar el código</text><text x="510" y="211" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">completo.</text><circle cx="416" cy="446" r="11" fill="#222"/><text x="416" y="450" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="488" cy="243" r="11" fill="#222"/><text x="488" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="510" y="239" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Mostrar vigencia y espera de</text><text x="510" y="257" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">reenvío por separado.</text><circle cx="416" cy="502" r="11" fill="#222"/><text x="416" y="506" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="488" cy="307" r="11" fill="#222"/><text x="488" y="311" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="510" y="303" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Confirmar solo con seis</text><text x="510" y="321" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">dígitos válidos.</text><circle cx="416" cy="678" r="11" fill="#222"/><text x="416" y="682" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="488" cy="371" r="11" fill="#222"/><text x="488" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="510" y="367" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">El sello describe únicamente</text><text x="510" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">el correo verificado.</text><text x="475" y="566" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Estados y recorrido</text><text x="475" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Correcto → M-02c → M-03</text><text x="475" y="638" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Inválido → M-02a</text><text x="475" y="681" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Vencido → M-02b</text><line x1="475" y1="790" x2="724" y2="790" stroke="#777" stroke-width="1.5"/><text x="475" y="816" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Referencia de pantalla: 412 × 915</text><text x="475" y="835" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Fidelidad: baja · Plataforma: común</text><text x="475" y="854" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Idioma: es-419 · Datos ilustrativos</text><text x="475" y="873" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">RichStudent · UPC-X</text><text x="475" y="906" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Pantalla principal · M-02</text></svg>
