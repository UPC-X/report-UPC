rva el</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">retorno a Guardados.</text><circle cx="416" cy="369" r="11" fill="#222"/><text x="416" y="373" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="488" cy="243" r="11" fill="#222"/><text x="488" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="510" y="239" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Quitar actualiza la lista y</text><text x="510" y="257" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">permite deshacer.</text><circle cx="416" cy="479" r="11" fill="#222"/><text x="416" y="483" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="488" cy="307" r="11" fill="#222"/><text x="488" y="311" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="510" y="303" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">El estado reservado se</text><text x="510" y="321" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">comunica con texto.</text><circle cx="416" cy="875" r="11" fill="#222"/><text x="416" y="879" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="488" cy="371" r="11" fill="#222"/><text x="488" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="510" y="367" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Guardados es un destino</text><text x="510" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">principal persistente.</text><text x="475" y="566" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Estados y recorrido</text><text x="475" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Abrir → M-05 / M-05a</text><text x="475" y="638" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Sin guardados → M-04a</text><text x="475" y="681" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Aviso retirado → M-05b</text><line x1="475" y1="790" x2="724" y2="790" stroke="#777" stroke-width="1.5"/><text x="475" y="816" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Referencia de pantalla: 412 × 915</text><text x="475" y="835" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Fidelidad: baja · Plataforma: común</text><text x="475" y="854" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Idioma: es-419 · Datos ilustrativos</text><text x="475" y="873" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">RichStudent · UPC-X</text><text x="475" y="906" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">Pantalla principal · M-04</text></svg>
