<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-04 · Guardados · UPC-X</title><desc id="description">La cantidad corresponde a la lista personal. Abrir una tarjeta conserva el retorno a Guardados. Quitar actualiza la lista y permite deshacer. El estado reservado se comunica con texto. Guardados es un destino principal persistente.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-04 · Guardados</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Guardados</text><text x="62" y="161" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">2 avisos guardados</text><text x="62" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Tus favoritos, en un solo lugar.</text><rect x="62" y="214" width="328" height="118" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="74" y="226" width="84" height="90" rx="10" fill="#e2e2e2" stroke="#777" stroke-width="1.5"/><line x1="82" y1="234" x2="150" y2="308" stroke="#777" stroke-width="1.5"/><line x1="150" y1="234" x2="82" y2="308" stroke="#777" stroke-width="1.5"/><rect x="82" y="256" width="68" height="30" rx="3" fill="#e2e2e2" stroke="none" stroke-width="1.5"/><text x="116" y="276" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#444" text-anchor="middle">Foto</text><text x="170" y="244" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Calculadora científica</text><text x="170" y="265" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#222" text-anchor="start">Monterrico · Como nuevo</text><text x="170" y="294" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#222" text-anchor="start">S/ 65.00</text><text x="170" y="315" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Ver detalle →</text><rect x="62" y="345" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="374" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Quitar de guardados</text><rect x="62" y="418" width="328" height="118" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="74" y="430" width="84" height="90" rx="10" fill="#e2e2e2" stroke="#777" stroke-width="1.5"/><line x1="82" y1="438" x2="150" y2="512" stroke="#777" stroke-width="1.5"/><line x1="150" y1="438" x2="82" y2="512" stroke="#777" stroke-width="1.5"/><rect x="82" y="460" width="68" height="30" rx="3" fill="#e2e2e2" stroke="none" stroke-width="1.5"/><text x="116" y="480" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#444" text-anchor="middle">Foto</text><text x="170" y="448" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Libro de cálculo</text><text x="170" y="469" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#222" text-anchor="start">San Miguel · Reservado</text><text x="170" y="498" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#222" text-anchor="start">S/ 40.00</text><text x="170" y="519" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Ver detalle →</text><rect x="62" y="549" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="578" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Quitar de guardados</text><rect x="62" y="645" width="328" height="110" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="671" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">El estado del aviso puede cambiar</text><text x="78" y="694" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Guardar no reserva el producto. Revisa</text><text x="78" y="711" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">su disponibilidad antes de contactar.</text><rect x="44" y="842" width="384" height="94" rx="0" fill="#f1f1f1" stroke="none" stroke-width="1.5"/><line x1="44" y1="842" x2="428" y2="842" stroke="#777" stroke-width="1.5"/><rect x="55" y="853" width="54" height="68" rx="10" fill="#f1f1f1" stroke="none" stroke-width="1.5"/><circle cx="82" cy="875" r="10" fill="#fff" stroke="#555"/><text x="82" y="910" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#222" text-anchor="middle">Inicio</text><rect x="132" y="853" width="54" height="68" rx="10" fill="#dedede" stroke="none" stroke-width="1.5"/><circle cx="159" cy="875" r="10" fill="#222" stroke="#555"/><text x="159" y="910" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#222" text-anchor="middle">Guardados</text><rect x="209" y="853" width="54" height="68" rx="10" fill="#f1f1f1" stroke="none" stroke-width="1.5"/><circle cx="236" cy="875" r="19" fill="#fff" stroke="#555"/><text x="236" y="881" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#222" text-anchor="middle">+</text><text x="236" y="910" font-family="Arial, sans-serif" font-size="10" font-weight