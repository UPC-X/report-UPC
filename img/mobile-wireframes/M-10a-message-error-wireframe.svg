<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-10a · Mensaje sin enviar · UPC-X</title><desc id="description">El reintento conserva hilo y destinatario. El texto no se pierde ni se duplica al reenviar. Mostrar enviado únicamente al confirmar el envío.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-10a · Mensaje sin enviar</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Mensaje sin enviar</text><rect x="62" y="145" width="328" height="66" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="76" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Calculadora científica</text><text x="76" y="192" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Camila R. · Monterrico</text><text x="372" y="182" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#222" text-anchor="end">›</text><rect x="62" y="267" width="328" height="113" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="297" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Nos vemos a las 14:30 en la</text><text x="78" y="316" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">biblioteca.</text><text x="78" y="359" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222" text-anchor="start">No enviado · Sin conexión</text><rect x="62" y="427" width="328" height="48" rx="12" fill="#222" stroke="#555" stroke-width="1.5"/><text x="226" y="456" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Reintentar mensaje</text><rect x="62" y="495" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="524" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Editar mensaje</text><line x1="190" y1="925" x2="282" y2="925" stroke="#777" stroke-width="1.5"/><text x="475" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Decisiones del wireframe</text><line x1="475" y1="84" x2="724" y2="84" stroke="#777" stroke-width="1.5"/><circle cx="416" cy="179" r="11" fill="#222"/><text x="416" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="488" cy="115" r="11" fill="#222"/><text x="488" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">El reintento conserva hilo y</text><text x="510" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">destinatario.</text><circle cx="416" cy="323" r="11" fill="#222"/><text x="416" y="327" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="488" cy="179" r="11" fill="#222"/><text x="488" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">El texto no se pierde ni se</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">duplica al reenviar.</text><circle cx="416" cy="451" r="11" fill="#222"/><text x="416" y="455" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="488" cy="243" r="11" fill="#222"/><text x="488" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="510" y="239" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Mostrar enviado únicamente al</text><text x="510" y="257" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">confirmar el envío.</text><text x="475" y="566" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Estados y recorrido</text><text x="475" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Reintentar → M-10</text><text x="475" y="638" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Editar conserva el borrador</text><line x1="475" y1="790" x2="724" y2="790" stroke="#777" stroke-width="1.5"/><text x="475" y="816" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Referencia de pantalla: 412 × 915</text><text x="475" y="835" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Fidelidad: baja · Plataforma: común</text><text x="475" y="854" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Idioma: es