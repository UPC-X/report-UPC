<svg xmlns="http://www.w3.org/2000/svg" width="760" height="980" viewBox="0 0 760 980" role="img" aria-labelledby="title description"><title id="title">M-06 · Mi publicación · UPC-X</title><desc id="description">Solo el propietario accede a la administración. Mostrar disponibilidad antes de las acciones. Editar conserva datos e imágenes válidos. La reserva se vincula a una conversación existente. La entrega se gestiona desde M-13, sin cierre unilateral. Retirar requiere confirmación y explica su efecto.</desc><rect width="760" height="980" fill="#fafafa"/><text x="30" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">UPC-X · Mobile wireframe · M-06 · Mi publicación</text><rect x="30" y="35" width="412" height="915" rx="34" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="62" y="76" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">9:41</text><line x1="365" y1="70" x2="378" y2="70" stroke="#777" stroke-width="1.5"/><rect x="386" y="64" width="23" height="10" rx="2" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="62" y="112" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#222" text-anchor="start">‹</text><text x="88" y="112" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start">Mi publicación</text><rect x="62" y="143" width="328" height="118" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><rect x="74" y="155" width="84" height="90" rx="10" fill="#e2e2e2" stroke="#777" stroke-width="1.5"/><line x1="82" y1="163" x2="150" y2="237" stroke="#777" stroke-width="1.5"/><line x1="150" y1="163" x2="82" y2="237" stroke="#777" stroke-width="1.5"/><rect x="82" y="185" width="68" height="30" rx="3" fill="#e2e2e2" stroke="none" stroke-width="1.5"/><text x="116" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#444" text-anchor="middle">Foto</text><text x="170" y="173" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222" text-anchor="start">Libro de cálculo</text><text x="170" y="194" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#222" text-anchor="start">Monterrico · Como nuevo</text><text x="170" y="223" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#222" text-anchor="start">S/ 40.00</text><text x="170" y="244" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Ver detalle →</text><rect x="62" y="287" width="328" height="86" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="313" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Estado: Activo</text><text x="78" y="336" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Tu aviso está visible y puede recibir</text><text x="78" y="353" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">consultas.</text><rect x="62" y="401" width="328" height="48" rx="12" fill="#222" stroke="#555" stroke-width="1.5"/><text x="226" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Editar publicación</text><rect x="62" y="465" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="494" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Reservar para una conversación</text><rect x="62" y="529" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="558" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Gestionar entrega</text><rect x="62" y="593" width="328" height="48" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="226" y="622" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="middle">Retirar publicación</text><rect x="62" y="680" width="328" height="112" rx="12" fill="#f1f1f1" stroke="#555" stroke-width="1.5"/><text x="78" y="706" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#222" text-anchor="start">Cierre con ambas confirmaciones</text><text x="78" y="729" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Gestionar entrega abre la transacción.</text><text x="78" y="746" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">El aviso se completa al confirmar ambas</text><text x="78" y="763" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">partes.</text><line x1="190" y1="925" x2="282" y2="925" stroke="#777" stroke-width="1.5"/><text x="475" y="72" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Decisiones del wireframe</text><line x1="475" y1="84" x2="724" y2="84" stroke="#777" stroke-width="1.5"/><circle cx="416" cy="207" r="11" fill="#222"/><text x="416" y="211" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="488" cy="115" r="11" fill="#222"/><text x="488" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="510" y="111" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Solo el propietario accede a</text><text x="510" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">la administración.</text><circle cx="416" cy="330" r="11" fill="#222"/><text x="416" y="334" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="488" cy="179" r="11" fill="#222"/><text x="488" y="183" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="510" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Mostrar disponibilidad antes</text><text x="510" y="193" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">de las acciones.</text><circle cx="416" cy="425" r="11" fill="#222"/><text x="416" y="429" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><circle cx="488" cy="243" r="11" fill="#222"/><text x="488" y="247" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="510" y="239" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Editar conserva datos e</text><text x="510" y="257" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">imágenes válidos.</text><circle cx="416" cy="489" r="11" fill="#222"/><text x="416" y="493" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><circle cx="488" cy="307" r="11" fill="#222"/><text x="488" y="311" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="510" y="303" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">La reserva se vincula a una</text><text x="510" y="321" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">conversación existente.</text><circle cx="416" cy="553" r="11" fill="#222"/><text x="416" y="557" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><circle cx="488" cy="371" r="11" fill="#222"/><text x="488" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="510" y="367" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">La entrega se gestiona desde</text><text x="510" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">M-13, sin cierre unilateral.</text><circle cx="416" cy="617" r="11" fill="#222"/><text x="416" y="621" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text><circle cx="488" cy="435" r="11" fill="#222"/><text x="488" y="439" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="510" y="431" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">Retirar requiere confirmación</text><text x="510" y="449" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#222" text-anchor="start">y explica su efecto.</text><text x="475" y="566" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222" text-anchor="start">Estados y recorrido</text><text x="475" y="595" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Editar → M-07c</text><text x="475" y="638" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Retirar → M-06a</text><text x="475" y="681" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#222" text-anchor="start">Entrega → M-13</text><line x1="475" y1="790" x2="724" y2="790" stroke="#777" stroke-width="1.5"/><text x="475" y="816" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Referencia de pantalla: 412 × 915</text><text x="475" y="835" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#222" text-anchor="start">Fidelidad: baja · Plataforma: común</text><text x="475" y="854" font-family="Arial, sans-serif" font-size="11