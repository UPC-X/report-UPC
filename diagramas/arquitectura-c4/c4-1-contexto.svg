<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" role="img"><title>C4 · Nivel 1 · Contexto del sistema</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="46" font-size="31" fill="#152E4D" font-weight="700">C4 · Nivel 1 · Contexto del sistema</text><text x="45" y="79" font-size="18" fill="#263449" font-weight="400">UPC-X · Marketplace de estudiantes UPC · Vista de contexto</text><polyline points="360,230 450,230 450,315 550,315" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="367" y="160" width="150.5" height="20" fill="white"/><text x="370" y="175" font-size="14" fill="#263449" font-weight="400">Consulta la landing</text></g><polyline points="360,460 550,460" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="365" y="387" width="150.5" height="20" fill="white"/><text x="368" y="402" font-size="14" fill="#263449" font-weight="400">Usa el marketplace;</text></g><g><rect x="365" y="406" width="203" height="20" fill="white"/><text x="368" y="421" font-size="14" fill="#263449" font-weight="400">aporta capturas opcionales</text></g><polyline points="910,310 1010,310 1010,265 1110,265" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="937" y="220" width="150.5" height="20" fill="white"/><text x="940" y="235" font-size="14" fill="#263449" font-weight="400">Solicita enviar OTP</text></g><polyline points="210,575 210,710 1265,710 1265,650" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g><rect x="467" y="665" width="345.5" height="20" fill="white"/><text x="470" y="680" font-size="14" fill="#263449" font-weight="400">Paga por su cuenta; el pago no pasa por UPC-X</text></g><polyline points="1265,180 1265,130 25,130 25,485 60,485" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><g><rect x="542" y="102" width="323" height="20" fill="white"/><text x="545" y="117" font-size="14" fill="#263449" font-weight="400">Entrega correo institucional al estudiante</text></g><g id="visitor"><rect x="60" y="160" width="300" height="140" rx="9" fill="#E8EDF5" stroke="#344C70" stroke-width="2"/><text x="78" y="185" font-size="13" fill="#344C70" font-weight="700">Persona</text><text x="78" y="214" font-size="20" fill="#172B45" font-weight="700">Visitante</text><text x="78" y="238" font-size="14" fill="#344C70" font-weight="400">Sin cuenta</text><text x="78" y="263" font-size="15" fill="#263449" font-weight="400">Conoce la propuesta y accede</text><text x="78" y="284" font-size="15" fill="#263449" font-weight="400">a los enlaces de la aplicación.</text></g><g id="student"><rect x="60" y="395" width="300" height="180" rx="9" fill="#E8EDF5" stroke="#344C70" stroke-width="2"/><text x="78" y="420" font-size="13" fill="#344C70" font-weight="700">Persona</text><text x="78" y="449" font-size="20" fill="#172B45" font-weight="700">Estudiante UPC</text><text x="78" y="473" font-size="14" fill="#344C70" font-weight="400">Comprador y/o vendedor</text><text x="78" y="498" font-size="15" fill="#263449" font-weight="400">Cuenta institucional verificada.</text><text x="78" y="519" font-size="15" fill="#263449" font-weight="400">Publica, conversa, coordina y</text><text x="78" y="540" font-size="15" fill="#263449" font-weight="400">confirma su propia entrega.</text></g><g id="upcx"><rect x="550" y="260" width="360" height="260" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2"/><text x="568" y="285" font-size="13" fill="#286095" font-weight="700">Sistema de software</text><text x="568" y="314" font-size="20" fill="#172B45" font-weight="700">UPC-X</text><text x="568" y="338" font-size="14" fill="#286095" font-weight="400">Marketplace web y móvil</text><text x="568" y="363" font-size="15" fill="#263449" font-weight="400">Landing, web y aplicación móvil.</text><text x="568" y="384" font-size="15" fill="#263449" font-weight="400">Identidad y marketplace compartidos.</text><text x="568" y="405" font-size="15" fill="#263449" font-weight="400">Registro de acuerdos y reputación.</text><text x="568" y="426" font-size="15" fill="#263449" font-weight="400">Evidencia de pago opcional.</text></g><g id="mail"><rect x="1110" y="180" width="310" height="170" rx="9" fill="#F0F2F5" stroke="#68778B" stroke-width="2"/><text x="1128" y="205" font-size="13" fill="#68778B" font-weight="700">Sistema externo</text><text x="1128" y="234" font-size="20" fill="#172B45" font-weight="700">Proveedor de correo</text><text x="1128" y="258" font-size="14" fill="#68778B" font-weight="400">SMTP / API de correo</text><text x="1128" y="283" font-size="15" fill="#263449" font-weight="400">Entrega códigos de verificación</text><text x="1128" y="304" font-size="15" fill="#263449" font-weight="400">y recuperación al correo UPC.</text><text x="1128" y="325" font-size="15" fill="#263449" font-weight="400">Proveedor: Resend.</text></g><g id="wallet"><rect x="1110" y="490" width="310" height="160" rx="9" fill="#F0F2F5" stroke="#68778B" stroke-width="2"/><text x="1128" y="515" font-size="13" fill="#68778B" font-weight="700">Sistema externo</text><text x="1128" y="544" font-size="20" fill="#172B45" font-weight="700">Yape / Plin</text><text x="1128" y="568" font-size="14" fill="#68778B" font-weight="400">Aplicaciones independientes</text><text x="1128" y="593" font-size="15" fill="#263449" font-weight="400">El estudiante realiza el pago fuera</text><text x="1128" y="614" font-size="15" fill="#263449" font-weight="400">de UPC-X o en efectivo.</text><text x="1128" y="635" font-size="15" fill="#263449" font-weight="400">Sin integración con la plataforma.</text></g><text x="45" y="805" font-size="15" fill="#526579" font-weight="700">LEYENDA</text><text x="145" y="805" font-size="16" fill="#263449" font-weight="400">Azul: elementos de UPC-X   ·   Gris: personas y sistemas externos</text><text x="45" y="834" font-size="16" fill="#263449" font-weight="400">Una misma persona puede comprar y vender con una sola identidad.</text><text x="45" y="858" font-size="16" fill="#263449" font-weight="400">UPC-X administra sus datos y archivos; los pagos ocurren fuera del sistema.</text></g></svg>
