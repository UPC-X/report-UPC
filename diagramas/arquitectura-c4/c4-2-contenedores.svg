<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1140" viewBox="0 0 1660 1140" role="img"><title>C4 · Nivel 2 · Contenedores de UPC-X</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="46" font-size="31" fill="#152E4D" font-weight="700">C4 · Nivel 2 · Contenedores de UPC-X</text><text x="45" y="79" font-size="18" fill="#263449" font-weight="400">Una API desplegable · Dos clientes autenticados · Landing informativa</text><rect x="330" y="125" width="980" height="850" rx="10" fill="#FCFDFE" stroke="#7E90A5" stroke-width="2" stroke-dasharray="9 5"/><text x="350" y="155" font-size="19" fill="#526579" font-weight="700">UPC-X · Límite del sistema de software</text><polyline points="275,230 385,230" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="284" y="193" width="45.5" height="20" fill="white"/><text x="287" y="208" font-size="14" fill="#263449" font-weight="400">HTTPS</text></g><polyline points="275,480 385,480" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="297" y="445" width="30.5" height="20" fill="white"/><text x="300" y="460" font-size="14" fill="#263449" font-weight="400">Usa</text></g><polyline points="157,600 157,815 385,815" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="192" y="775" width="128" height="20" fill="white"/><text x="195" y="790" font-size="14" fill="#263449" font-weight="400">Usa en navegador</text></g><polyline points="715,500 890,500" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="732" y="432" width="98" height="20" fill="white"/><text x="735" y="447" font-size="14" fill="#263449" font-weight="400">HTTPS / JSON</text></g><g><rect x="732" y="451" width="135.5" height="20" fill="white"/><text x="735" y="466" font-size="14" fill="#263449" font-weight="400">Bearer; multipart</text></g><polyline points="715,805 810,805 810,600 890,600" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="725" y="831" width="98" height="20" fill="white"/><text x="728" y="846" font-size="14" fill="#263449" font-weight="400">HTTPS / JSON</text></g><g><rect x="725" y="850" width="98" height="20" fill="white"/><text x="728" y="865" font-size="14" fill="#263449" font-weight="400">Cookie; CORS</text></g><polyline points="1065,430 1065,340" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="1087" y="360" width="83" height="20" fill="white"/><text x="1090" y="375" font-size="14" fill="#263449" font-weight="400">JDBC / SQL</text></g><g><rect x="1087" y="379" width="30.5" height="20" fill="white"/><text x="1090" y="394" font-size="14" fill="#263449" font-weight="400">TLS</text></g><polyline points="1065,650 1065,770" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="1087" y="684" width="113" height="20" fill="white"/><text x="1090" y="699" font-size="14" fill="#263449" font-weight="400">API S3 / HTTPS</text></g><polyline points="1240,540 1370,540" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="1252" y="468" width="90.5" height="20" fill="white"/><text x="1255" y="483" font-size="14" fill="#263449" font-weight="400">HTTPS / API</text></g><g id="visitor"><rect x="40" y="165" width="235" height="140" rx="9" fill="#E8EDF5" stroke="#344C70" stroke-width="2"/><text x="58" y="190" font-size="13" fill="#344C70" font-weight="700">Persona</text><text x="58" y="219" font-size="20" fill="#172B45" font-weight="700">Visitante</text><text x="58" y="243" font-size="14" fill="#344C70" font-weight="400">Navegador</text><text x="58" y="268" font-size="15" fill="#263449" font-weight="400">Consulta información pública.</text></g><g id="student"><rect x="40" y="440" width="235" height="160" rx="9" fill="#E8EDF5" stroke="#344C70" stroke-width="2"/><text x="58" y="465" font-size="13" fill="#344C70" font-weight="700">Persona</text><text x="58" y="494" font-size="20" fill="#172B45" font-weight="700">Estudiante UPC</text><text x="58" y="518" font-size="14" fill="#344C70" font-weight="400">Cuenta verificada</text><text x="58" y="543" font-size="15" fill="#263449" font-weight="400">Compra y/o vende.</text><text x="58" y="564" font-size="15" fill="#263449" font-weight="400">Usa móvil o navegador.</text></g><g id="landing"><rect x="385" y="180" width="330" height="150" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2"/><text x="403" y="205" font-size="13" fill="#286095" font-weight="700">Contenedor · Sitio estático</text><text x="403" y="234" font-size="20" fill="#172B45" font-weight="700">Landing page</text><text x="403" y="258" font-size="14" fill="#286095" font-weight="400">HTML / CSS / JavaScript</text><text x="403" y="283" font-size="15" fill="#263449" font-weight="400">Presentación y enlaces de acceso.</text><text x="403" y="304" font-size="15" fill="#263449" font-weight="400">Sin lógica del marketplace.</text></g><g id="mobile"><rect x="385" y="420" width="330" height="175" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2"/><text x="403" y="445" font-size="13" fill="#286095" font-weight="700">Contenedor · Aplicación móvil</text><text x="403" y="474" font-size="20" fill="#172B45" font-weight="700">Cliente móvil</text><text x="403" y="498" font-size="14" fill="#286095" font-weight="400">Flutter / Dart</text><text x="403" y="523" font-size="15" fill="#263449" font-weight="400">Android e iOS.</text><text x="403" y="544" font-size="15" fill="#263449" font-weight="400">Mismos casos de uso que la web.</text><text x="403" y="565" font-size="15" fill="#263449" font-weight="400">Bearer en almacenamiento seguro.</text></g><g id="web"><rect x="385" y="725" width="330" height="170" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2"/><text x="403" y="750" font-size="13" fill="#286095" font-weight="700">Contenedor · SPA</text><text x="403" y="779" font-size="20" fill="#172B45" font-weight="700">Cliente web</text><text x="403" y="803" font-size="14" fill="#286095" font-weight="400">Angular / TypeScript</text><text x="403" y="828" font-size="15" fill="#263449" font-weight="400">Mismos casos de uso que el móvil.</text><text x="403" y="849" font-size="15" fill="#263449" font-weight="400">Cookie HttpOnly + Secure.</text><text x="403" y="870" font-size="15" fill="#263449" font-weight="400">Diseño responsive.</text></g><g id="api"><rect x="890" y="430" width="350" height="220" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2"/><text x="908" y="455" font-size="13" fill="#286095" font-weight="700">Contenedor · API REST</text><text x="908" y="484" font-size="20" fill="#172B45" font-weight="700">Backend modular</text><text x="908" y="508" font-size="14" fill="#286095" font-weight="400">Java 21 / Spring Boot / JDBC</text><text x="908" y="533" font-size="15" fill="#263449" font-weight="400">Identidad y autorización por recurso.</text><text x="908" y="554" font-size="15" fill="#263449" font-weight="400">Casos de uso y transacciones ACID.</text><text x="908" y="575" font-size="15" fill="#263449" font-weight="400">Contrato OpenAPI; chat por polling.</text><text x="908" y="596" font-size="15" fill="#263449" font-weight="400">Monolito modular en un proceso.</text></g><g id="db"><rect x="880" y="175" width="360" height="165" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2"/><text x="898" y="200" font-size="13" fill="#286095" font-weight="700">Contenedor · Base de datos</text><text x="898" y="229" font-size="20" fill="#172B45" font-weight="700">Datos estructurados</text><text x="898" y="253" font-size="14" fill="#286095" font-weight="400">PostgreSQL 17 / Flyway</text><text x="898" y="278" font-size="15" fill="#263449" font-weight="400">Cuentas, avisos, chat y acuerdos.</text><text x="898" y="299" font-size="15" fill="#263449" font-weight="400">Alojada en Neon con TLS.</text><text x="898" y="320" font-size="15" fill="#263449" font-weight="400">No accesible desde los clientes.</text></g><g id="media"><rect x="875" y="770" width="365" height="155" rx="9" fill="#EAF2FB" stroke="#286095" stroke-width="2"/><text x="893" y="795" font-size="13" fill="#286095" font-weight="700">Contenedor · Almacén de archivos</text><text x="893" y="824" font-size="20" fill="#172B45" font-weight="700">Fotos y evidencias</text><text x="893" y="848" font-size="14" fill="#286095" font-weight="400">Bucket privado Cloudflare R2</text><text x="893" y="873" font-size="15" fill="#263449" font-weight="400">Objetos fuera de PostgreSQL.</text><text x="893" y="894" font-size="15" fill="#263449" font-weight="400">Acceso mediado por la API.</text><text x="893" y="915" font-size="15" fill="#263449" font-weight="400">Evidencias de pago privadas.</text></g><g id="mail"><rect x="1370" y="450" width="245" height="190" rx="9" fill="#F0F2F5" stroke="#68778B" stroke-width="2"/><text x="1388" y="475" font-size="13" fill="#68778B" font-weight="700">Sistema externo</text><text x="1388" y="504" font-size="20" fill="#172B45" font-weight="700">Correo transaccional</text><text x="1388" y="528" font-size="14" fill="#68778B" font-weight="400">Resend (HTTPS)</text><text x="1388" y="553" font-size="15" fill="#263449" font-weight="400">Envía códigos de verificación</text><text x="1388" y="574" font-size="15" fill="#263449" font-weight="400">y recuperación de contraseña.</text><text x="1388" y="595" font-size="15" fill="#263449" font-weight="400">No recibe datos del marketplace.</text></g><text x="45" y="1045" font-size="15" fill="#526579" font-weight="700">LEYENDA</text><text x="145" y="1045" font-size="16" fill="#263449" font-weight="400">Azul: elementos de UPC-X   ·   Gris: personas y sistemas externos</text><text x="45" y="1074" font-size="16" fill="#263449" font-weight="400">Los clientes no acceden directamente a la base de datos ni al almacén de archivos.</text><text x="45" y="1098" font-size="16" fill="#263449" font-weight="400">El proveedor de hosting no cambia el límite lógico: la base y el bucket son datos de UPC-X.</text></g></svg>
